<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121715"><meta name="description" content="每週器械健身課表：自由選擇器材與訓練順序，記錄當天完成進度。"><title>今日訓練 · Workout</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121715'/%3E%3Cpath d='M7 10v12m5-15v18m8-18v18m5-15v12M7 16h18' stroke='%23cff56b' stroke-width='3'/%3E%3C/svg%3E"><style>
.mode-switch{display:flex;gap:12px;margin:0 0 24px}.mode-switch button{flex:1}.mode-switch [aria-pressed=true]{background:var(--lime);color:#182010;border-color:var(--lime)}.header-tools{display:flex;align-items:center;gap:8px}.refresh{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:24px;line-height:1}.refresh:hover{color:var(--lime);border-color:var(--lime)}[hidden]{display:none!important}.view-switch{display:flex;gap:8px;margin:24px 0}.view-switch button{flex:1;min-height:46px;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent}.view-switch [aria-pressed=true]{background:var(--lime);color:#182010;border-color:var(--lime)}.week-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.week-card.today{border-color:var(--lime)}.week-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.week-card h3{margin:0;font-size:20px}.week-card ol{padding-left:24px}.week-card summary{cursor:pointer;min-height:44px;padding:10px 0;color:var(--lime)}.week-card summary:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.week-card ul{padding-left:20px}.week-card li{margin:10px 0;overflow-wrap:anywhere}.week-card .start{margin-top:12px;width:100%}.week-card h4{margin-bottom:6px}.week-card details{border-top:1px solid var(--line)}:root{color-scheme:dark;--bg:#121715;--panel:#1c2420;--line:#37413a;--muted:#a9b6ac;--lime:#cff56b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f4ed;font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px 64px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--lime);font-weight:700}h1{font-size:30px;margin:3px 0 0;letter-spacing:-.04em}.date{font-size:14px;color:var(--muted);text-align:right}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:28px 0}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.day{border:1px solid var(--line);border-radius:12px;background:transparent;padding:12px 4px;min-height:70px}.day small{display:block;color:var(--muted);font-size:12px}.day[aria-pressed=true]{background:var(--lime);color:#182010;border-color:var(--lime)}.day[aria-pressed=true] small{color:#354123}.summary{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:26px 0 10px}h2{margin:0;font-size:26px}.muted{color:var(--muted);font-size:14px}.count{font-size:32px;font-weight:700;color:var(--lime);white-space:nowrap}.count span{font-size:16px;color:var(--muted)}progress{width:100%;height:6px;appearance:none;border:0;display:block}progress::-webkit-progress-bar{background:var(--line);border-radius:8px}progress::-webkit-progress-value{background:var(--lime);border-radius:8px}progress::-moz-progress-bar{background:var(--lime)}.status{margin:12px 0 22px;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.card.active{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}.card.done{border-color:#648a52}.card-head{padding:18px 18px 12px}.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.badge{color:var(--lime)}h3{font-size:20px;margin:8px 0 2px}.reps{color:var(--lime);font-size:14px;min-height:23px}.options{border:0;margin:0;padding:0 10px 8px;min-width:0}.options legend{padding:0 8px 8px;color:var(--muted);font-size:13px}.option{display:flex;align-items:flex-start;gap:10px;padding:11px 8px;border-radius:9px;cursor:pointer}.option:has(input:checked){background:#2d392a}.option input{accent-color:var(--lime);margin:5px 0 0;flex-shrink:0;width:18px;height:18px}.option strong{font-size:14px;font-weight:500;display:block}.option span{min-width:0}.english{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.actions{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}.start{border:1px solid #56664d;background:transparent;border-radius:10px;padding:11px;min-height:46px}.active .start{background:var(--lime);color:#182010;border-color:var(--lime)}button:disabled{opacity:.55;cursor:default}.complete{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;cursor:pointer}.complete input{accent-color:var(--lime);width:20px;height:20px}.walk{margin-top:22px;padding:18px 20px;border:1px dashed #536247;border-radius:14px;display:flex;justify-content:space-between;gap:20px}.walk strong{color:var(--lime)}footer{margin-top:28px;font-size:13px;color:var(--muted)}.rest{padding:45px 24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-top:24px}.rest .symbol{color:var(--lime);font-size:48px}.rest p{color:var(--muted)}#warning{color:#ffcf8a} @media(max-width:760px){main{max-width:540px;padding:24px 18px 40px}.cards{grid-template-columns:1fr}.days{gap:5px}.day{min-height:64px;padding:8px 2px}.day small{font-size:12px}h1{font-size:27px}.date{font-size:12px}.card-head{padding:18px 20px 12px}.options{padding:0 12px 10px}.actions{grid-template-columns:1fr 1fr}.english{font-size:14px}.option strong{font-size:16px}.option{padding:12px 8px}.walk{font-size:14px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><main><header><div><div class="eyebrow">WORKOUT / WEEKLY</div><h1>今日訓練</h1></div><div class="header-tools"><div class="date" id="date"></div><button type="button" class="refresh" aria-label="重新整理網頁" title="重新整理網頁" onclick="window.location.reload()">↻</button></div></header><nav class="view-switch" aria-label="檢視方式"><button type="button" data-view="daily" aria-pressed="true">今日訓練</button><button type="button" data-view="weekly" aria-pressed="false">一週課表</button></nav><section id="weekly" aria-label="一週課表" hidden></section><nav class="days" aria-label="選擇星期" id="days"></nav><div id="mode"></div><div id="warning" role="status"></div><section id="workout" aria-label="當日課表"></section><footer>各星期進度保留至今天結束。<br>每天 00:00（台灣時間）全部重設。</footer><noscript>請開啟 JavaScript，以選擇器材及記錄完成進度。</noscript></main><script src="./workout-plan.js"></script><script>
let view='daily';
const CONFIG=window.WORKOUT_CONFIG;
const PLAN=Object.fromEntries(Object.entries(CONFIG.days).filter(([n,d])=>d.groups.length).map(([n,d])=>[n,d.groups]));
const KEY='workout-daily-v2';
const week=['日','一','二','三','四','五','六'];
const titles=Object.fromEntries(Object.entries(CONFIG.days).map(([n,d])=>[n,d.title]));
function taipeiDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function weekday(date){return new Date(date+'T12:00:00+08:00').getUTCDay()}
let stamp=taipeiDate(), selected=weekday(stamp),state={date:stamp,revision:CONFIG.revision,mondayMode:'badminton',days:{}},storageOK=true;
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.date===stamp&&saved.revision===CONFIG.revision&&saved.days&&typeof saved.days==='object')state=saved}catch{storageOK=false}}
load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false}document.getElementById('warning').textContent=storageOK?'':'瀏覽器無法保存進度；本次操作仍可使用，關閉頁面後可能遺失。'}
function dayState(){const groups=PLAN[selected];if(selected===1&&state.mondayMode!=='training')return null;if(!groups)return null;let d=state.days[selected];if(!d||!Array.isArray(d.items)||d.items.length!==3)d=state.days[selected]={active:null,items:groups.map(g=>({choice:g.options[0].id,done:false}))};d.items=d.items.map((v,i)=>({choice:groups[i].options.some(o=>o.id===v?.choice)?v.choice:groups[i].options[0].id,done:v?.done===true}));if(!Number.isInteger(d.active)||d.active<0||d.active>2||d.items[d.active].done)d.active=null;return d}
function rollover(){const now=taipeiDate();if(now===stamp)return false;stamp=now;state={date:stamp,revision:CONFIG.revision,mondayMode:'badminton',days:{}};selected=weekday(stamp);save();render();return true}
function reps(g,id){return g.options.find(o=>o.id===id)?.reps||g.reps}

function renderWeek(){
 const today=weekday(stamp);
 document.getElementById('weekly').innerHTML=`<h2>一週課表</h2><p class="muted">每個群組選一個動作，訓練順序自由安排。</p>`+[1,2,3,4,5,6,0].map(n=>{
 const groups=PLAN[n]||[];
 return `<article class="week-card ${n===today?'today':''}"><div class="week-head"><h3>週${week[n]} · ${n===1?'羽球／補充重訓':titles[n]}</h3>${n===today?'<span class="badge">今天</span>':''}</div>${n===1?'<p class="muted">羽球或補充重訓二選一。</p>':''}${groups.length?`<ol>${groups.map(g=>`<li>${g.title}</li>`).join('')}</ol><details><summary>展開器材選項與組次</summary>${groups.map((g,i)=>`<h4>${i+1}. ${g.title}</h4><ul>${g.options.map(o=>`<li>${o.cn}<span class="english">${o.en}</span><span class="reps">${reps(g,o.id)}</span></li>`).join('')}</ul>`).join('')}</details><p class="muted">重訓後 · ${CONFIG.walking}</p><button class="start" type="button" data-go="${n}">${n===1?'前往週一，選擇活動':'前往訓練'}</button>`:'<p class="muted">休息，可輕鬆散步、伸展。</p>'}</article>`;
 }).join('');
}
function renderView(){
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
 document.getElementById('weekly').hidden=view!=='weekly';
 for(const id of ['days','mode','workout'])document.getElementById(id).hidden=view==='weekly';
 if(view==='weekly')renderWeek();
}
function render(){
 renderView();
 document.getElementById('date').textContent=stamp.replaceAll('-','.')+' · 台灣';
 document.getElementById('days').innerHTML=[1,2,3,4,5,6,0].map(n=>`<button class="day" data-day="${n}" aria-pressed="${selected===n}" aria-label="星期${week[n]}，${n===1?'羽球或重訓':titles[n]}">週${week[n]}<small>${n===weekday(stamp)?'今天':(n===1?'可選':PLAN[n]?'重訓':titles[n])}</small></button>`).join('');
 document.getElementById('mode').innerHTML=selected===1?`<div class="mode-switch" role="group" aria-label="週一活動"><button class="start" data-mode="badminton" aria-pressed="${state.mondayMode!=='training'}">羽球</button><button class="start" data-mode="training" aria-pressed="${state.mondayMode==='training'}">補充重訓</button></div>`:'';
 const root=document.getElementById('workout'),d=dayState();
 if(!d){root.innerHTML=`<div class="rest"><div class="eyebrow">週${week[selected]} / ${selected===1?'BADMINTON':'RECOVERY'}</div><div class="symbol">${selected===1?'↗':'Ⅱ'}</div><h2>${selected===1?'今天，打羽球。':'留一天給恢復。'}</h2><p>${selected===1?'暖身後打羽球，今天不另排重訓。':'今天不安排重訓，可以輕鬆散步、伸展。'}</p></div>`;return}
 const done=d.items.filter(v=>v.done).length;
 root.innerHTML=`<div class="summary"><div><div class="eyebrow">週${week[selected]} / TRAINING</div><h2>${titles[selected]}</h2></div><div class="count">${done}<span> / 3 項完成</span></div></div><progress value="${done}" max="3" aria-label="已完成 ${done} 項，共三項"></progress><p class="status" aria-live="polite">${done===3?'今天的三項訓練已完成。':d.active===null?'自由選擇順序，器材有空就可以開始。':`目前正在做第 ${d.active+1} 項 · ${PLAN[selected][d.active].title}`}</p><div class="cards">${PLAN[selected].map((g,i)=>{const item=d.items[i];return `<article class="card ${d.active===i?'active':''} ${item.done?'done':''}"><div class="card-head"><div class="topline"><span>項目 0${i+1}</span><span class="badge">${item.done?'✓ 已完成':d.active===i?'進行中':'尚未完成'}</span></div><h3>${g.title}</h3><div class="reps">${reps(g,item.choice)}</div></div><fieldset class="options"><legend>選擇今天的器材／動作</legend>${g.options.map(o=>`<label class="option"><input type="radio" name="choice-${i}" data-choice="${i}" value="${o.id}" ${o.id===item.choice?'checked':''} ${item.done?'disabled':''}><span><strong>${o.cn}</strong><span class="english">${o.en}</span></span></label>`).join('')}</fieldset><div class="actions"><button class="start" data-start="${i}" ${item.done?'disabled':''}>${item.done?'訓練完成':d.active===i?'正在進行':'開始此項'}</button><label class="complete"><input type="checkbox" data-done="${i}" ${item.done?'checked':''}>${item.done?'取消完成':'標記完成'}</label></div></article>`}).join('')}</div><div class="walk"><span>訓練後 · Walking</span><strong>${CONFIG.walking}</strong></div><p class="muted">先暖身，再開始正式組。每個群組只選一個動作。</p>`;
}
document.addEventListener('click',e=>{if(rollover())return;const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();return}const go=e.target.closest('[data-go]');if(go){selected=Number(go.dataset.go);view='daily';render();document.querySelector(`[data-day="${selected}"]`).focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});return}const mode=e.target.closest('[data-mode]');if(mode){state.mondayMode=mode.dataset.mode;save();render();return}const day=e.target.closest('[data-day]');if(day){selected=Number(day.dataset.day);render();return}const start=e.target.closest('[data-start]');if(start){const d=dayState(),i=Number(start.dataset.start);if(!d.items[i].done){d.active=i;save();render();document.querySelector(`[data-start="${i}"]`).focus({preventScroll:true})}}});
document.addEventListener('change',e=>{if(rollover())return;const d=dayState();if(!d)return;let focus;if(e.target.matches('[data-choice]')){const i=Number(e.target.dataset.choice);d.items[i].choice=Number(e.target.value);focus=`[data-choice="${i}"][value="${e.target.value}"]`}else if(e.target.matches('[data-done]')){const i=Number(e.target.dataset.done);d.items[i].done=e.target.checked;if(d.active===i)d.active=null;focus=`[data-done="${i}"]`}else return;save();render();document.querySelector(focus)?.focus({preventScroll:true})});
setInterval(rollover,1000);window.addEventListener('focus',rollover);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});window.addEventListener('storage',e=>{if(e.key===KEY){if(!rollover()){state={date:stamp,revision:CONFIG.revision,mondayMode:'badminton',days:{}};load();render()}}});
render();save();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_workout_progress',description:'Read the selected weekday workout and its current progress.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>{rollover();return {date:stamp,weekday:selected,title:titles[selected],groups:PLAN[selected]||[],progress:dayState()}}})).catch(()=>{})}catch{}}
</script></body></html>
